<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tool.yool.me · 공무원 업무 도구</title>
<meta name="description" content="설치 없이 브라우저에서 바로 쓰는 공무원 업무 도구 모음. 파일은 서버로 전송되지 않습니다.">
<style>
  :root{
    --ink:#12130f;
    --paper:#e8e4d8;
    --line:#12130f;
    --amber:#c8410b;
    --amber-soft:#e8620f;
    --dim:#5c5a4e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Consolas","DejaVu Sans Mono",monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .frame{
    width:100%;
    max-width:560px;
    border:2px solid var(--line);
    background:var(--paper);
    box-shadow:6px 6px 0 var(--line);
  }
  header{
    border-bottom:2px solid var(--line);
    padding:16px 18px;
  }
  header h1{
    font-size:20px;
    font-weight:700;
    letter-spacing:-.01em;
  }
  header .sub{
    font-size:11px;
    color:var(--dim);
    margin-top:6px;
    line-height:1.6;
  }
  .body{padding:18px}
  .tools{
    display:grid;
    grid-template-columns:1fr 1fr;   /* 2x2 */
    gap:13px;
  }
  .tool{
    display:flex;
    flex-direction:column;
    border:2px solid var(--line);
    background:#f0ece0;
    padding:13px;
    text-decoration:none;
    color:var(--ink);
    box-shadow:3px 3px 0 var(--line);
    transition:transform .06s, box-shadow .06s, background .12s;
  }
  .tool:hover{background:#fff}
  .tool:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
  .tool .name{font-size:14px;font-weight:700;line-height:1.35;margin:7px 0 5px;word-break:keep-all}
  .tool .desc{font-size:11px;color:var(--dim);line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
  .tool .desc .kw{white-space:nowrap}
  .tool.soon{opacity:.55;cursor:default;box-shadow:3px 3px 0 #9a9689}
  .tool.soon:hover{background:#f0ece0}
  .tool.soon:active{transform:none;box-shadow:3px 3px 0 #9a9689}
  .badge{
    align-self:flex-start;
    font-size:9px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--amber);
    border:1px solid var(--amber);
    padding:1px 6px;
  }
  .badge.gray{color:var(--dim);border-color:var(--dim)}
  @media (max-width:360px){
    .body{padding:14px}
    .tools{gap:10px}
    .tool{padding:11px}
    .tool .name{font-size:13px}
  }
  .note{
    margin-top:6px;
    font-size:10px;
    color:var(--dim);
    line-height:1.7;
    border-top:1px solid #c3bfb2;
    padding-top:12px;
  }
  .note b{color:var(--ink)}
</style>
</head>
<body>
<div class="frame">
  <header>
    <h1>tool.yool.me</h1>
    <div class="sub">설치 없이 브라우저에서 바로 쓰는 업무 도구.</div>
  </header>
  <div class="body">

    <div class="tools">

      <a class="tool" href="/xlsx-unlock/">
        <span class="badge">running</span>
        <div class="name">엑셀 암호 해제</div>
        <div class="desc">암호를 넣으면 파일의 열기 잠금을 지웁니다.</div>
      </a>

      <a class="tool" href="/xlsx-unprotect/">
        <span class="badge">running</span>
        <div class="name">엑셀 편집 잠금 해제</div>
        <div class="desc">비밀번호 없이 시트·통합문서·수정 잠금을 풉니다.</div>
      </a>

      <a class="tool" href="/hwpx-edit/">
        <span class="badge">running</span>
        <div class="name">HWPX 편집기</div>
        <div class="desc">한글 문서의 <span class="kw">{{치환자}}</span>·본문·표를 채워 다시 저장합니다.</div>
      </a>

      <div class="tool soon">
        <span class="badge gray">준비 중</span>
        <div class="name">그린우편 검사기</div>
        <div class="desc">e-그린우편 파일의 글자수·금지 문자를 미리 점검합니다.</div>
      </div>

    </div>

    <div class="note">
      모든 처리는 <b>브라우저 안에서만</b> 이루어집니다.
      파일이 어디로도 전송되지 않아 망분리 환경에서도 쓸 수 있습니다.
    </div>

  </div>
</div>
</body>
</html>
