<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>엑셀 암호 해제</title>
<style>
  :root{
    --ink:#12130f;
    --paper:#e8e4d8;
    --line:#12130f;
    --amber:#c8410b;
    --amber-soft:#e8620f;
    --ok:#2f6b3d;
    --err:#a3231b;
    --dim:#5c5a4e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"Consolas","DejaVu Sans Mono",monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  .frame{
    width:100%;
    max-width:560px;
    border:2px solid var(--line);
    background:var(--paper);
    box-shadow:6px 6px 0 var(--line);
  }
  header{
    border-bottom:2px solid var(--line);
    padding:14px 18px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  header .tag{
    font-size:10px;
    letter-spacing:.18em;
    text-transform:uppercase;
    color:var(--dim);
  }
  h1{
    font-size:19px;
    font-weight:700;
    letter-spacing:-.01em;
  }
  .body{padding:18px}

  /* 드롭존 */
  .drop{
    border:2px dashed var(--line);
    padding:34px 18px;
    text-align:center;
    cursor:pointer;
    transition:background .12s, border-color .12s;
    user-select:none;
  }
  .drop:hover{background:#ded9cb}
  .drop.over{
    background:#dfe9df;
    border-color:var(--ok);
    border-style:solid;
  }
  .drop .big{font-size:14px;font-weight:700;margin-bottom:6px}
  .drop .sub{font-size:11px;color:var(--dim);line-height:1.6}
  .drop .file{
    font-size:12px;
    margin-top:10px;
    color:var(--amber);
    font-weight:700;
    word-break:break-all;
  }

  label.fld{
    display:block;
    font-size:10px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--dim);
    margin:18px 0 6px;
  }
  input[type=password]{
    width:100%;
    border:2px solid var(--line);
    background:#f0ece0;
    color:var(--ink);
    font-family:inherit;
    font-size:14px;
    padding:11px 12px;
    outline:none;
  }
  input[type=password]:focus{background:#fff;border-color:var(--amber)}

  .row{display:flex;gap:10px;align-items:center;margin-top:8px}
  .show{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim);cursor:pointer}

  button.go{
    width:100%;
    margin-top:20px;
    border:2px solid var(--line);
    background:var(--amber);
    color:#fff;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    letter-spacing:.04em;
    padding:13px;
    cursor:pointer;
    box-shadow:3px 3px 0 var(--line);
    transition:transform .06s, box-shadow .06s, background .12s;
  }
  button.go:hover:not(:disabled){background:var(--amber-soft)}
  button.go:active:not(:disabled){transform:translate(3px,3px);box-shadow:0 0 0 var(--line)}
  button.go:disabled{
    background:#bdb9ac;
    color:#eceadf;
    cursor:not-allowed;
    box-shadow:3px 3px 0 #9a9689;
  }

  .status{
    margin-top:16px;
    border-top:2px solid var(--line);
    padding-top:14px;
    font-size:12px;
    line-height:1.7;
    min-height:22px;
  }
  .status .line{display:flex;gap:8px}
  .status .mark{font-weight:700}
  .s-ok .mark{color:var(--ok)}
  .s-err .mark{color:var(--err)}
  .s-work .mark{color:var(--amber)}

  .bar{
    height:6px;
    border:2px solid var(--line);
    margin-top:10px;
    background:#f0ece0;
    display:none;
  }
  .bar > i{
    display:block;
    height:100%;
    width:0%;
    background:var(--amber);
    transition:width .15s;
  }

  .note{
    margin-top:16px;
    font-size:10px;
    color:var(--dim);
    line-height:1.7;
    border-top:1px solid #c3bfb2;
    padding-top:12px;
  }
  .note b{color:var(--ink)}
  input[type=file]{display:none}
</style>
</head>
<body>
<div class="frame">
  <header>
    <h1>엑셀 암호 해제</h1>
    <a class="tag" href="/" style="color:inherit;text-decoration:none">← tool.yool.me</a>
  </header>
  <div class="body">

    <div class="drop" id="drop">
      <div class="big">파일을 여기에 끌어다 놓기</div>
      <div class="sub">또는 눌러서 선택 · .xlsx / .xlsm<br>열기 암호가 걸린 파일</div>
      <div class="file" id="fileName"></div>
      <input type="file" id="fileInput" accept=".xlsx,.xlsm,.xltx,.xltm,.docx,.pptx">
    </div>

    <label class="fld" for="pw">암호</label>
    <input type="password" id="pw" placeholder="파일을 열 때 쓰는 암호" autocomplete="off">
    <div class="row">
      <span class="show" id="toggle">□ 암호 표시</span>
    </div>

    <button class="go" id="go" disabled>암호 제거하고 내려받기</button>

    <div class="bar" id="bar"><i id="barFill"></i></div>
    <div class="status" id="status"></div>

    <div class="note">
      파일과 암호는 이 창을 벗어나지 않습니다. 서버로 아무것도 전송하지 않으며,
      브라우저 안에서만 복호화합니다. <b>암호를 아는 본인 파일에만</b> 사용하세요.
      결과는 <b>_unlocked</b>가 붙은 새 파일로 저장되고 원본은 그대로 남습니다.
      <br><br>
      <b>tool.yool.me</b> · 공무원 업무 도구
    </div>

  </div>
</div>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const drop = $('drop'), fileInput = $('fileInput'), fileName = $('fileName');
const pw = $('pw'), go = $('go'), statusEl = $('status');
const bar = $('bar'), barFill = $('barFill'), toggle = $('toggle');

let currentFile = null;

/* ---------- UI 배선 ---------- */
drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => setFile(e.target.files[0]));

['dragenter','dragover'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => {
  if (e.dataTransfer.files.length) setFile(e.dataTransfer.files[0]);
});

toggle.addEventListener('click', () => {
  const show = pw.type === 'password';
  pw.type = show ? 'text' : 'password';
  toggle.textContent = (show ? '■' : '□') + ' 암호 표시';
});

function setFile(f){
  if (!f) return;
  currentFile = f;
  fileName.textContent = f.name;
  refresh();
  status('', '');
}
function refresh(){ go.disabled = !(currentFile && pw.value.length); }
pw.addEventListener('input', refresh);
pw.addEventListener('keydown', e => { if (e.key==='Enter' && !go.disabled) run(); });

function status(kind, msg){
  const cls = kind==='ok'?'s-ok':kind==='err'?'s-err':kind==='work'?'s-work':'';
  const mark = kind==='ok'?'✓':kind==='err'?'✕':kind==='work'?'▸':'';
  statusEl.className = 'status ' + cls;
  statusEl.innerHTML = msg ? `<div class="line"><span class="mark">${mark}</span><span>${msg}</span></div>` : '';
}
function progress(p){
  bar.style.display = p==null ? 'none' : 'block';
  if (p!=null) barFill.style.width = (p*100).toFixed(0)+'%';
}

go.addEventListener('click', run);

async function run(){
  go.disabled = true;
  try{
    status('work', '파일 읽는 중…');
    progress(0);
    const buf = new Uint8Array(await currentFile.arrayBuffer());

    // OLE 컨테이너인지 확인 (열기암호는 항상 OLE로 감싸짐)
    if (!(buf[0]===0xD0 && buf[1]===0xCF && buf[2]===0x11 && buf[3]===0xE0)){
      // 이미 평범한 ZIP(xlsx)이면 암호가 없는 것
      if (buf[0]===0x50 && buf[1]===0x4B){
        throw new Error('이 파일에는 열기 암호가 없습니다. (이미 잠겨 있지 않음)');
      }
      throw new Error('엑셀 파일이 아니거나 형식을 알 수 없습니다.');
    }

    status('work', '암호화 정보 분석 중…');
    const ole = parseOLE(buf);
    const info = ole.getStream('EncryptionInfo');
    const pkg  = ole.getStream('EncryptedPackage');

    const ver = (info[0]) | (info[1]<<8);
    const minor = (info[2]) | (info[3]<<8);
    // Agile = 4.4
    if (!(ver===4 && minor===4)){
      throw new Error('지원하지 않는 암호화 방식입니다. (Office 2010 이하 예전 방식일 수 있음)');
    }

    const xml = new TextDecoder('utf-8').decode(info.subarray(8));
    const meta = parseXml(xml);
    if (meta.hashAlgo !== 'SHA512' && meta.hashAlgo !== 'SHA256' && meta.hashAlgo !== 'SHA384' && meta.hashAlgo !== 'SHA1'){
      throw new Error('지원하지 않는 해시 알고리즘: ' + meta.hashAlgo);
    }

    status('work', `키 유도 중… (반복 ${meta.spinCount.toLocaleString()}회)`);
    await tick();

    const secretKey = await unlockKey(pw.value, meta, (p)=>progress(p*0.85));
    if (!secretKey){
      progress(null);
      throw new Error('암호가 일치하지 않습니다. 다시 확인해 주세요.');
    }

    status('work', '문서 복호화 중…');
    progress(0.9);
    await tick();
    const plain = await decryptPackage(secretKey, meta, pkg);
    progress(1);

    // 결과 검증: ZIP 매직
    if (!(plain[0]===0x50 && plain[1]===0x4B)){
      throw new Error('복호화에 실패했습니다. 파일이 손상되었을 수 있습니다.');
    }

    download(plain, outName(currentFile.name));
    status('ok', '완료. 암호 없는 파일을 내려받았습니다.');
    setTimeout(()=>progress(null), 800);
  }catch(err){
    progress(null);
    status('err', err.message || String(err));
  }finally{
    refresh();
  }
}

function outName(name){
  const dot = name.lastIndexOf('.');
  if (dot<0) return name + '_unlocked';
  return name.slice(0,dot) + '_unlocked' + name.slice(dot);
}
function download(bytes, name){
  const blob = new Blob([bytes], {type:'application/octet-stream'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
const tick = () => new Promise(r=>setTimeout(r,0));

/* ---------- XML 파싱 ---------- */
function parseXml(xml){
  const kd = xml.match(/<keyData[^>]*>/)[0];
  const ek = xml.match(/<p:encryptedKey[^>]*\/?>/)[0];
  const A = (s,n)=>{ const m=s.match(new RegExp(n+'="([^"]*)"')); return m?m[1]:null; };
  const b64 = (s)=>{ const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return u; };
  return {
    hashAlgo: A(kd,'hashAlgorithm').toUpperCase(),
    keyBits: parseInt(A(ek,'keyBits')),
    spinCount: parseInt(A(ek,'spinCount')),
    blockSize: parseInt(A(kd,'blockSize')),
    keyDataSalt: b64(A(kd,'saltValue')),
    ekSalt: b64(A(ek,'saltValue')),
    encVerifierInput: b64(A(ek,'encryptedVerifierHashInput')),
    encVerifierValue: b64(A(ek,'encryptedVerifierHashValue')),
    encKeyValue: b64(A(ek,'encryptedKeyValue')),
  };
}

/* ---------- 해시 이름 매핑 ---------- */
const HASHNAME = { SHA512:'SHA-512', SHA384:'SHA-384', SHA256:'SHA-256', SHA1:'SHA-1' };

/* ---------- 키 유도 & 언랩 ---------- */
async function deriveKey(password, salt, spinCount, blockKey, keyBits, hashAlgo, onProg){
  const subtle = crypto.subtle;
  const name = HASHNAME[hashAlgo];
  // password → UTF-16LE
  const pwBytes = new Uint8Array(password.length*2);
  for (let i=0;i<password.length;i++){ const c=password.charCodeAt(i); pwBytes[i*2]=c&0xff; pwBytes[i*2+1]=(c>>8)&0xff; }

  let h = new Uint8Array(await subtle.digest(name, concat(salt, pwBytes)));
  const it = new Uint8Array(4);
  const step = Math.max(1, Math.floor(spinCount/50));
  for (let i=0;i<spinCount;i++){
    it[0]=i&0xff; it[1]=(i>>8)&0xff; it[2]=(i>>16)&0xff; it[3]=(i>>24)&0xff;
    h = new Uint8Array(await subtle.digest(name, concat(it, h)));
    if (onProg && (i % step === 0)){ onProg(i/spinCount); await tick(); }
  }
  let hfinal = new Uint8Array(await subtle.digest(name, concat(h, blockKey)));
  const keyBytes = keyBits/8;
  if (hfinal.length < keyBytes){
    const out = new Uint8Array(keyBytes).fill(0x36);
    out.set(hfinal,0); return out;
  }
  return hfinal.subarray(0, keyBytes);
}

const BK_VIN = new Uint8Array([0xfe,0xa7,0xd2,0x76,0x3b,0x4b,0x9e,0x79]);
const BK_VVAL= new Uint8Array([0xd7,0xaa,0x0f,0x6d,0x30,0x61,0x34,0x4e]);
const BK_KEY = new Uint8Array([0x14,0x6e,0x0b,0xe7,0xab,0xac,0xd0,0xd6]);

async function unlockKey(password, m, onProg){
  const name = HASHNAME[m.hashAlgo];
  // 1) verifier로 암호 확인
  const kIn = await deriveKey(password, m.ekSalt, m.spinCount, BK_VIN, m.keyBits, m.hashAlgo, onProg);
  const vInput = await aesCbcDec(kIn, m.ekSalt, m.encVerifierInput);
  const kVal = await deriveKey(password, m.ekSalt, m.spinCount, BK_VVAL, m.keyBits, m.hashAlgo, null);
  const vValue = await aesCbcDec(kVal, m.ekSalt, m.encVerifierValue);
  const calc = new Uint8Array(await crypto.subtle.digest(name, vInput));
  if (!eqPrefix(calc, vValue)) return null;   // 암호 불일치
  // 2) 실제 키 언랩
  const kKey = await deriveKey(password, m.ekSalt, m.spinCount, BK_KEY, m.keyBits, m.hashAlgo, null);
  return await aesCbcDec(kKey, m.ekSalt, m.encKeyValue);
}

async function decryptPackage(secretKey, m, pkg){
  // 앞 8바이트 = 원본 길이(LE64)
  let total = 0;
  for (let i=7;i>=0;i--) total = total*256 + pkg[i];
  const enc = pkg.subarray(8);
  const SEG = 4096;
  const out = new Uint8Array(enc.length);
  const name = HASHNAME[m.hashAlgo];
  let bn = 0, pos = 0;
  const blk = new Uint8Array(4);
  for (let off=0; off<enc.length; off+=SEG){
    blk[0]=bn&0xff; blk[1]=(bn>>8)&0xff; blk[2]=(bn>>16)&0xff; blk[3]=(bn>>24)&0xff;
    const ivFull = new Uint8Array(await crypto.subtle.digest(name, concat(m.keyDataSalt, blk)));
    const iv = ivFull.subarray(0, m.blockSize);
    const chunk = enc.subarray(off, off+SEG);
    const dec = await aesCbcDec(secretKey, iv, chunk);
    out.set(dec, pos); pos += dec.length;
    bn++;
  }
  return out.subarray(0, total);
}

/* ---------- AES-CBC (패딩 없음) ----------
   WebCrypto AES-CBC은 PKCS7 패딩을 강제하므로, 마지막 블록을 우회하는 방식으로
   no-padding 복호화를 구현한다. */
async function aesCbcDec(key, iv, data){
  if (data.length === 0) return new Uint8Array(0);
  const subtle = crypto.subtle;
  const ck = await subtle.importKey('raw', key.buffer.slice(key.byteOffset,key.byteOffset+key.byteLength), 'AES-CBC', false, ['decrypt']);
  // 트릭: data 뒤에 "0x10짜리 유효 패딩 블록"을 우리가 직접 암호화해 붙인다.
  // 마지막 암호블록을 IV로 삼아, 알려진 평문(16바이트 0x10)을 암호화한 블록을 append.
  const enc = await subtle.importKey('raw', key.buffer.slice(key.byteOffset,key.byteOffset+key.byteLength), 'AES-CBC', false, ['encrypt']);
  const lastCipher = data.subarray(data.length-16);
  const padPlain = new Uint8Array(16).fill(16);
  // AES-CBC 암호화: C = E(P xor IV). IV=lastCipher, P=padPlain 한 블록.
  // WebCrypto encrypt는 또 PKCS7을 붙여 32바이트를 내므로 앞 16바이트만 취함.
  const padCipherFull = new Uint8Array(await subtle.encrypt({name:'AES-CBC', iv:lastCipher}, enc, padPlain));
  const padBlock = padCipherFull.subarray(0,16);

  const full = concat(data, padBlock);
  const decFull = new Uint8Array(await subtle.decrypt({name:'AES-CBC', iv}, ck, full));
  // decFull은 원본 data와 같은 길이(패딩 제거됨)
  return decFull;
}

/* ---------- 유틸 ---------- */
function concat(a,b){ const o=new Uint8Array(a.length+b.length); o.set(a,0); o.set(b,a.length); return o; }
function eqPrefix(a,b){ const n=Math.min(a.length,b.length); for(let i=0;i<n;i++) if(a[i]!==b[i]) return false; return true; }

/* ---------- OLE(CFB) 파서 ---------- */
function parseOLE(buf){
  const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  const u32 = (o)=>dv.getUint32(o,true);
  const u16 = (o)=>dv.getUint16(o,true);
  if (u16(28)!==0xFFFE){ /* byte order */ }
  const sectorShift = u16(30);
  const sectorSize = 1<<sectorShift;
  const miniShift = u16(32);
  const miniSize = 1<<miniShift;
  const dirStart = u32(48);
  const miniCutoff = u32(56);
  const miniFATstart = u32(60);
  const difStart = u32(68);
  const numDIF = u32(72);
  const ENDCHAIN=0xFFFFFFFE, FREESECT=0xFFFFFFFF;
  const sect = (n)=>512 + n*sectorSize;

  let difat=[];
  for(let i=0;i<109;i++) difat.push(u32(76+i*4));
  let ds=difStart;
  for(let k=0;k<numDIF && ds!==ENDCHAIN && ds!==FREESECT;k++){
    const base=sect(ds), cnt=sectorSize/4-1;
    for(let i=0;i<cnt;i++) difat.push(u32(base+i*4));
    ds=u32(base+cnt*4);
  }
  const FAT=[];
  for(const s of difat){
    if(s===FREESECT||s===ENDCHAIN) continue;
    const base=sect(s);
    for(let i=0;i<sectorSize/4;i++) FAT.push(u32(base+i*4));
  }

  function chain(start,size,fat,reader){
    const parts=[]; let cur=start;
    while(cur!==ENDCHAIN && cur!==FREESECT && cur>=0){
      parts.push(reader(cur)); cur=fat[cur];
    }
    return cat(parts);
  }
  function cat(parts){ let n=0; for(const p of parts)n+=p.length; const o=new Uint8Array(n); let x=0; for(const p of parts){o.set(p,x); x+=p.length;} return o; }

  const readBig=(n)=>buf.subarray(sect(n), sect(n)+sectorSize);
  const miniFATraw = chain(miniFATstart, 0, FAT, readBig);
  const miniFATdv = new DataView(miniFATraw.buffer, miniFATraw.byteOffset, miniFATraw.byteLength);
  const miniFAT=[]; for(let i=0;i<Math.floor(miniFATraw.length/4);i++) miniFAT.push(miniFATdv.getUint32(i*4,true));

  const dirRaw = chain(dirStart,0,FAT,readBig);
  const ddv = new DataView(dirRaw.buffer, dirRaw.byteOffset, dirRaw.byteLength);
  const entries=[];
  for(let off=0; off+128<=dirRaw.length; off+=128){
    const nameLen=ddv.getUint16(off+64,true);
    if(nameLen===0) continue;
    let name='';
    for(let i=0;i<nameLen-2;i+=2){ const c=ddv.getUint16(off+i,true); if(c)name+=String.fromCharCode(c); }
    entries.push({ name, type:dirRaw[off+66], start:ddv.getUint32(off+116,true), size:ddv.getUint32(off+120,true) });
  }
  const root = entries.find(e=>e.type===5);
  const miniStream = chain(root.start,0,FAT,readBig).subarray(0,root.size);
  const readMini=(n)=>miniStream.subarray(n*miniSize, n*miniSize+miniSize);

  function getStream(name){
    const e = entries.find(x=>x.name===name && x.type===2);
    if(!e) throw new Error('스트림 없음: '+name);
    if(e.size < miniCutoff) return chain(e.start,0,miniFAT,readMini).subarray(0,e.size);
    return chain(e.start,0,FAT,readBig).subarray(0,e.size);
  }
  return { getStream };
}
</script>
</body>
</html>
